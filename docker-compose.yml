services:
  api:
    build:
      context: .
      dockerfile: gaugevision/api/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  gradio:
    build:
      context: .
      dockerfile: gaugevision/app/Dockerfile
    ports:
      - "7860:7860"
    environment:
      - GAUGEVISION_API_URL=http://api:8000
    depends_on:
      - api
